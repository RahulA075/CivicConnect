spring:
  datasource:
    url: jdbc:h2:mem:civicconnect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
  cache:
    type: simple     # Use simple in-memory cache for tests (no Redis needed)

logging:
  level:
    root: WARN
    com.civicconnect: WARN

app:
  jwt:
    secret: TestSecretKeyForJwtSigningThatIsAtLeast64CharactersLongForHmacSha256!!
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 86400000
