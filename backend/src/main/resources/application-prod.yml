spring:
  jpa:
    show-sql: false
  flyway:
    baseline-on-migrate: false

logging:
  level:
    root: WARN
    com.civicconnect: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId},%X{spanId}] %-5level %logger{36} - %msg%n"

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  tracing:
    sampling:
      probability: 0.05
