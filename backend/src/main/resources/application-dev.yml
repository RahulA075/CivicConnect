spring:
  jpa:
    hibernate:
      ddl-auto: none  
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.civicconnect: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

app:
  jwt:
    secret: DevOnlySecretKeyThatIsAtLeast64CharactersLongForHmacSha256SigningAlgorithm!!
